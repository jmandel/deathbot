# Builds the web app and publishes it to GitHub Pages, together with SKILL.zip:
# a snapshot of exactly the skill release the published page runs.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: web
        run: bun run build.ts && bunx tsc --noEmit
      - name: Check the skill snapshot
        run: unzip -l web/dist/SKILL.zip | tail -1 && cat web/dist/skill-release.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
